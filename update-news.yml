name: Actualiser VeilleJurSoc

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: veillejursoc-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les nouveautés
        run: python scripts/scrape.py

      - name: Enregistrer les nouveautés
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Aucune modification."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json
          git commit -m "Mise à jour automatique de la veille"

          # Récupérer une éventuelle mise à jour de main effectuée
          # pendant le scraping, puis rejouer notre commit au-dessus.
          git pull --rebase origin main

          git push origin HEAD:main
